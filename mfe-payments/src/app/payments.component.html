<section class="payments">
  <header class="payments__header">
    <h1 class="payments__title">{{ t().title }}</h1>
    <p class="payments__subtitle">{{ t().subtitle }}</p>
  </header>

  <div class="payments__kpis">
    <cap-metric-card
      [iconName]="iconVolume"
      [value]="volumeValue"
      [variation]="volumeVariation"
      [title]="t().kpiVolumeTitle"
      [description]="t().kpiVolumeDesc"
      [positive]="true">
    </cap-metric-card>

    <cap-metric-card
      [iconName]="iconPending"
      [value]="pendingValue"
      [variation]="pendingVariation"
      [title]="t().kpiPendingTitle"
      [description]="t().kpiPendingDesc"
      [positive]="true">
    </cap-metric-card>

    <cap-metric-card
      [iconName]="iconAvgTime"
      [value]="avgTimeValue"
      [variation]="avgTimeVariation"
      [title]="t().kpiAvgTitle"
      [description]="t().kpiAvgDesc"
      [positive]="true">
    </cap-metric-card>
  </div>

  <div class="payments__table">
    <cap-table [columns]="columns()" [data]="payments" trackByKey="id">
      <ng-template capCellTemplate="amount" let-value>
        <span class="payments__amount">{{ formatAmount(value) }}</span>
      </ng-template>
      <ng-template capCellTemplate="status" let-value>
        <cap-status-badge [kind]="statusKind[asStatus(value)]">
          {{ t().status[asStatus(value)] }}
        </cap-status-badge>
      </ng-template>
    </cap-table>
  </div>

  <footer class="payments__footer">
    <p>{{ t().footer }}</p>
  </footer>
</section>
